<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="700" height="800" fill="none">
  <defs>
    <linearGradient id="audIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="700" height="800" fill="url(#audIconBg)"/>
  
  <!-- Manifest Grid -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1.5">
    <rect x="150" y="150" width="400" height="500" rx="16"/>
    <line x1="150" y1="230" x2="550" y2="230"/>
    <line x1="150" y1="310" x2="550" y2="310"/>
    <line x1="150" y1="390" x2="550" y2="390"/>
    <line x1="150" y1="470" x2="550" y2="470"/>
  </g>

  <!-- Central Badge -->
  <g transform="translate(350, 400)">
    <circle cx="0" cy="0" r="120" fill="#022C22" stroke="#34D399" stroke-width="4"/>
    <path d="M-30 0l20 20 40-40" stroke="#34D399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="0" y="55" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">SCMTR &amp; EDI READY</text>
    <text x="0" y="75" text-anchor="middle" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">AIR &amp; SEA CONSOLE</text>
  </g>

  <g transform="translate(80, 160)">
    <rect width="250" height="70" rx="14" fill="#022C22" fill-opacity="0.9" stroke="#34D399" stroke-width="1.5"/>
    <text x="20" y="30" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">Acceptance Rate</text>
    <text x="20" y="54" fill="#34D399" font-family="system-ui, sans-serif" font-size="20" font-weight="700">99.99% First-Time</text>
  </g>

  <g transform="translate(370, 620)">
    <rect width="250" height="70" rx="14" fill="#022C22" fill-opacity="0.9" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="20" y="30" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">Console Processing</text>
    <text x="20" y="54" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Minutes vs Hours</text>
  </g>
</svg>
