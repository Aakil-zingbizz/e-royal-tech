      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="700" height="800" fill="url(#audFrtBg)"/>
  
  <!-- Multi-modal Network Lines -->
  <g opacity="0.2" stroke="#A5B4FC" stroke-width="2">
    <circle cx="350" cy="400" r="220" stroke-dasharray="8 6"/>
