<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="700" height="800" fill="none">
  <defs>
    <linearGradient id="audScmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="50%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="700" height="800" fill="url(#audScmBg)"/>
  
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1.5">
    <path d="M100 100l250 150 250-150v300l-250 150-250-150V100z"/>
    <path d="M350 250v300"/>
    <path d="M100 250l250 150 250-150"/>
  </g>

  <!-- Warehouse / Supply Network Graphics -->
  <g transform="translate(350, 420)">
    <circle cx="0" cy="0" r="130" fill="#021B2B" stroke="#38BDF8" stroke-width="4"/>
    <!-- 3D Isometric Box -->
    <path d="M0 -50 L60 -15 L60 50 L0 85 L-60 50 L-60 -15 Z" fill="#0369A1" stroke="#38BDF8" stroke-width="3"/>
    <path d="M0 -50 L60 -15 L0 20 L-60 -15 Z" fill="#0284C7"/>
    <path d="M0 20 L0 85" stroke="#38BDF8" stroke-width="2"/>
    <text x="0" y="115" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">WAREHOUSE AUTOMATION</text>
  </g>

  <!-- Chips -->
  <g transform="translate(90, 160)">
