    <text x="20" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Inventory Accuracy</text>
    <text x="20" y="54" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="20" font-weight="700">99.8% Live Precision</text>
  </g>

  <g transform="translate(360, 620)">
    <rect width="260" height="70" rx="14" fill="#021B2B" fill-opacity="0.9" stroke="#34D399" stroke-width="1.5"/>
    <text x="20" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Fulfillment Velocity</text>
    <text x="20" y="54" fill="#34D399" font-family="system-ui, sans-serif" font-size="20" font-weight="700">2x Faster Pick &amp; Pack</text>
