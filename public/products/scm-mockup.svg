<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="scmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="scmAcent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="scmdrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#scmdrop)">
    <!-- Main Window Frame -->
    <rect x="40" y="40" width="720" height="520" rx="16" fill="url(#scmBg)" stroke="#334155" stroke-width="2"/>
    
    <!-- Top Window Bar -->
    <rect x="40" y="40" width="720" height="46" rx="16" fill="#1E293B"/>
    <circle cx="70" cy="63" r="6" fill="#EF4444"/>
    <circle cx="90" cy="63" r="6" fill="#F59E0B"/>
    <circle cx="110" cy="63" r="6" fill="#10B981"/>
    <rect x="250" y="51" width="300" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="320" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">app.eroyaltech.com/scm/inventory</text>
    
    <!-- Sidebar -->
    <rect x="40" y="86" width="160" height="474" fill="#0F172A"/>
    <rect x="56" y="110" width="128" height="32" rx="8" fill="url(#scmAcent)"/>
    <text x="74" y="131" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">📦 Inventory Control</text>
    <text x="74" y="175" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🚚 Dispatch Orders</text>
    <text x="74" y="215" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">🏬 Warehouse Hubs</text>
    <text x="74" y="255" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">📊 Barcode / RFID</text>
    <text x="74" y="295" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">⚙️ Settings &amp; API</text>

    <!-- Main Content Area -->
    <!-- Metric Cards -->
    <g transform="translate(220, 106)">
      <rect x="0" y="0" width="150" height="84" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Total SKUs In-Stock</text>
      <text x="16" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="700">142,890</text>
      <text x="100" y="60" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">+12%</text>

      <rect x="170" y="0" width="150" height="84" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="186" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Fulfillment Rate</text>
      <text x="186" y="60" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="24" font-weight="700">99.8%</text>
      <text x="270" y="60" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Opt.</text>

      <rect x="340" y="0" width="170" height="84" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="356" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Active Hubs</text>
      <text x="356" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="700">18 Centers</text>
      <text x="460" y="60" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Live</text>
    </g>

    <!-- Visual Chart / Map Mockup -->
    <g transform="translate(220, 210)">
      <rect x="0" y="0" width="510" height="180" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Real-Time Distribution &amp; Stock Velocity</text>
      
      <!-- Graph Line -->
      <path d="M 30 140 Q 100 80, 180 110 T 320 60 T 480 40" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
      <path d="M 30 140 Q 100 80, 180 110 T 320 60 T 480 40 L 480 160 L 30 160 Z" fill="url(#scmAcent)" opacity="0.15"/>
      <circle cx="320" cy="60" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
      <circle cx="480" cy="40" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
    </g>

    <!-- Table Rows -->
    <g transform="translate(220, 410)">
      <rect x="0" y="0" width="510" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="20" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">BATCH ID</text>
      <text x="140" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DESTINATION HUB</text>
      <text x="320" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">STATUS</text>
      <text x="430" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">UNITS</text>
      
      <line x1="20" y1="38" x2="490" y2="38" stroke="#334155"/>
      
      <text x="20" y="64" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="500">SCM-8921-A</text>
      <text x="140" y="64" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Chennai Central Hub</text>
      <rect x="315" y="50" width="76" height="20" rx="6" fill="#065F46"/>
      <text x="327" y="64" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Dispatched</text>
      <text x="430" y="64" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13">4,800</text>

      <text x="20" y="98" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="500">SCM-8922-B</text>
      <text x="140" y="98" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Mumbai Port Facility</text>
      <rect x="315" y="84" width="76" height="20" rx="6" fill="#1E3A8A"/>
      <text x="331" y="98" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="600">In Transit</text>
      <text x="430" y="98" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13">12,450</text>
    </g>
  </g>
</svg>
